<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d4e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="sd">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="350" cy="248" rx="200" ry="12" fill="#000" opacity="0.06"/>

  <!-- Left motor + arm -->
  <line x1="104" y1="140" x2="210" y2="140" stroke="#2a2a3a" stroke-width="10" stroke-linecap="round"/>
  <rect x="68" y="118" width="44" height="44" rx="8" fill="#1a1a2e" filter="url(#sd)"/>
  <rect x="74" y="124" width="32" height="32" rx="5" fill="#252540"/>
  <circle cx="90" cy="140" r="8" fill="#e94560"/>
  <!-- Motor label -->
  <text x="90" y="178" text-anchor="middle" font-family="Arial" font-size="9" fill="#888" letter-spacing="1">0802SE</text>

  <!-- Right motor + arm -->
  <line x1="490" y1="140" x2="596" y2="140" stroke="#2a2a3a" stroke-width="10" stroke-linecap="round"/>
  <rect x="588" y="118" width="44" height="44" rx="8" fill="#1a1a2e" filter="url(#sd)"/>
  <rect x="594" y="124" width="32" height="32" rx="5" fill="#252540"/>
  <circle cx="610" cy="140" r="8" fill="#e94560"/>
  <text x="610" y="178" text-anchor="middle" font-family="Arial" font-size="9" fill="#888" letter-spacing="1">0802SE</text>

  <!-- Center body (side view) -->
  <rect x="210" y="108" width="280" height="70" rx="10" fill="url(#body-grad)" filter="url(#sd)"/>
  <!-- FC board line -->
  <line x1="225" y1="130" x2="475" y2="130" stroke="#3a3a5a" stroke-width="1.5"/>
  <!-- ESC layer -->
  <rect x="240" y="134" width="220" height="24" rx="4" fill="#252540"/>
  <text x="350" y="150" text-anchor="middle" font-family="Arial" font-size="9" fill="#6b7280" letter-spacing="1.5">F4 AIO · 5A ESC</text>

  <!-- Camera (front) -->
  <rect x="330" y="93" width="40" height="28" rx="5" fill="#1a1a2e"/>
  <polygon points="350,81 332,92 368,92" fill="#1a1a2e"/>
  <rect x="336" y="96" width="28" height="20" rx="3" fill="#252540"/>
  <circle cx="350" cy="106" r="7" fill="#111" stroke="#555" stroke-width="1.5"/>
  <circle cx="350" cy="106" r="3.5" fill="#e94560" opacity="0.6"/>

  <!-- Battery bay (bottom) -->
  <rect x="255" y="178" width="190" height="28" rx="7" fill="#252540" stroke="#3a3a5a" stroke-width="1"/>
  <text x="350" y="196" text-anchor="middle" font-family="Arial" font-size="9" fill="#6b7280" letter-spacing="1.5">1S 300mAh HV</text>

  <!-- Dimension annotation: 75mm -->
  <line x1="90" y1="218" x2="610" y2="218" stroke="#ccc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="90" y1="213" x2="90" y2="223" stroke="#ccc" stroke-width="1"/>
  <line x1="610" y1="213" x2="610" y2="223" stroke="#ccc" stroke-width="1"/>
  <text x="350" y="232" text-anchor="middle" font-family="Arial" font-size="9" fill="#aaa">↔ 75mm</text>

  <!-- Label -->
  <text x="350" y="262" text-anchor="middle" font-family="'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#bbb" opacity="0.8">METEOR75 PRO · SIDE PROFILE</text>
</svg>
