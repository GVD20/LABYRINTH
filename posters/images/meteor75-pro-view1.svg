<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="glow-red">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background subtle glow -->
  <ellipse cx="250" cy="210" rx="170" ry="120" fill="url(#bg-glow)"/>

  <!-- Frame arms -->
  <line x1="186" y1="153" x2="314" y2="281" stroke="#2a2a3a" stroke-width="9" stroke-linecap="round"/>
  <line x1="314" y1="153" x2="186" y2="281" stroke="#2a2a3a" stroke-width="9" stroke-linecap="round"/>

  <!-- Center body (FC/ESC stack) -->
  <rect x="222" y="193" width="56" height="56" rx="7" fill="#1a1a2e" filter="url(#drop-shadow)"/>
  <rect x="230" y="201" width="40" height="40" rx="4" fill="#252540"/>
  <!-- ESC pads -->
  <rect x="234" y="207" width="7" height="5" rx="1" fill="#3a3a5a"/>
  <rect x="246" y="207" width="7" height="5" rx="1" fill="#3a3a5a"/>
  <rect x="259" y="207" width="7" height="5" rx="1" fill="#3a3a5a"/>
  <!-- LED -->
  <circle cx="250" cy="224" r="3.5" fill="#e94560" filter="url(#glow-red)"/>
  <circle cx="250" cy="224" r="2" fill="#ff6b8a"/>

  <!-- Prop guards (large outer rings) -->
  <circle cx="186" cy="153" r="44" fill="none" stroke="#2a2a3a" stroke-width="3.5"/>
  <circle cx="186" cy="153" r="38" fill="none" stroke="#e94560" stroke-width="1" opacity="0.35"/>
  <circle cx="314" cy="153" r="44" fill="none" stroke="#2a2a3a" stroke-width="3.5"/>
  <circle cx="314" cy="153" r="38" fill="none" stroke="#e94560" stroke-width="1" opacity="0.35"/>
  <circle cx="186" cy="281" r="44" fill="none" stroke="#2a2a3a" stroke-width="3.5"/>
  <circle cx="186" cy="281" r="38" fill="none" stroke="#e94560" stroke-width="1" opacity="0.35"/>
  <circle cx="314" cy="281" r="44" fill="none" stroke="#2a2a3a" stroke-width="3.5"/>
  <circle cx="314" cy="281" r="38" fill="none" stroke="#e94560" stroke-width="1" opacity="0.35"/>

  <!-- Motor hubs -->
  <circle cx="186" cy="153" r="12" fill="#2a2a3a"/>
  <circle cx="186" cy="153" r="7" fill="#e94560"/>
  <circle cx="314" cy="153" r="12" fill="#2a2a3a"/>
  <circle cx="314" cy="153" r="7" fill="#e94560"/>
  <circle cx="186" cy="281" r="12" fill="#2a2a3a"/>
  <circle cx="186" cy="281" r="7" fill="#e94560"/>
  <circle cx="314" cy="281" r="12" fill="#2a2a3a"/>
  <circle cx="314" cy="281" r="7" fill="#e94560"/>

  <!-- Spinning props (blurred ellipses) -->
  <ellipse cx="186" cy="153" rx="34" ry="5.5" fill="#1a1a2e" opacity="0.18" transform="rotate(-20 186 153)"/>
  <ellipse cx="186" cy="153" rx="34" ry="5.5" fill="#1a1a2e" opacity="0.15" transform="rotate(70 186 153)"/>
  <ellipse cx="314" cy="153" rx="34" ry="5.5" fill="#1a1a2e" opacity="0.18" transform="rotate(20 314 153)"/>
  <ellipse cx="314" cy="153" rx="34" ry="5.5" fill="#1a1a2e" opacity="0.15" transform="rotate(-70 314 153)"/>
  <ellipse cx="186" cy="281" rx="34" ry="5.5" fill="#1a1a2e" opacity="0.18" transform="rotate(15 186 281)"/>
  <ellipse cx="186" cy="281" rx="34" ry="5.5" fill="#1a1a2e" opacity="0.15" transform="rotate(-75 186 281)"/>
  <ellipse cx="314" cy="281" rx="34" ry="5.5" fill="#1a1a2e" opacity="0.18" transform="rotate(-15 314 281)"/>
  <ellipse cx="314" cy="281" rx="34" ry="5.5" fill="#1a1a2e" opacity="0.15" transform="rotate(75 314 281)"/>

  <!-- Camera module -->
  <rect x="233" y="182" width="34" height="18" rx="4" fill="#1a1a2e"/>
  <rect x="239" y="185" width="22" height="12" rx="2" fill="#2a2a3a"/>
  <circle cx="250" cy="191" r="4" fill="#111" stroke="#444" stroke-width="1"/>
  <circle cx="250" cy="191" r="2" fill="#333"/>

  <!-- Label -->
  <text x="250" y="365" text-anchor="middle" font-family="'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#bbb" opacity="0.8">METEOR75 PRO · TOP VIEW</text>
</svg>
